on:
  workflow_dispatch:
#  push:
#    branches: ["main"]
#  pull_request:
#    branches: [ "main"]

env:
  REGISTRY: ghcr.io
  IMG_NAME: ${{ github.actor }}/movie_review:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Start Maven test & package
        run: mvn clean package -DskipTests

      - name: Create artifact
        uses: actions/download-artifact@v8
        with:
          name: 'artifact'
          path: ./target/movie_review*.jar

  publish:
    needs: build
    name: Publish Image to Github registry

    runs-on: ubuntu-latest

    steps:
      - uses: action/checkout@v7

      - name: Download artifact
        uses: action/upload-artifact@v7
        with:
          name: 'artifact'

      - name: Login to Docker
        run: |
          echo ${{ secrets.PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Publish
        run: |
          docker build . -t ${{ env.REGISTRY }}/${{ env.IMG_NAME }}
          docker push ${{ env.REGISTRY }}/${{ env.IMG_NAME }}

  deploy:
    needs: publish
    name: Deploy image to server
    runs-on: ubuntu-latest

    steps:
      - name: Connect to server via SSH and pull docker image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secret.SSH_HOST }}
          username: ${{ SSH_USER }}
          key: ${{ secret.PAT }}
          script: |
            cd ${{ secret.WORK_DIR }}
            docker compose pull
            docker compose up -d
            exit